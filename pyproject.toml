[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "partfield-mc-pipeline"
version = "0.11.0"
description = "NVIDIA PartField segmentation to textured cuboids and interface-constrained paper primitives with frozen source joints and non-convex local patch fitting"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "Pillow>=10.0",
  "trimesh>=4.0",
  "huggingface_hub>=0.23",
]

[project.scripts]
partfield-mc = "partfield_mc.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["partfield_mc*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
